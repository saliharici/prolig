name: Pro-Lig CI

on:
  push:
    branches: [main, feat/compensation-engine]
  pull_request:
    branches: [main, feat/p2-professional-question-editor-20261012]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        # package-lock.json on main predates npm 11's full optional-platform lock expansion.
        # Keep CI read-only with respect to the repository while installing from package.json.
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Validate read-only P2 pilot preflight syntax
        run: |
          node --check scripts/p2-pilot-readonly-check.mjs
          node --check scripts/p2-acceptance-branch-check.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        # DB integration suites intentionally require real Pilot DB credentials and are run only in guarded environments.
        run: npx vitest run --exclude 'tests/integration/**'


      - name: Build
        run: npm run build

      - name: Navigation browser checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/prolig-navigation-preview.log 2>&1 &
          node scripts/verify-navigation.mjs
