name: Pro-Lig CI

on:
  push:
    branches: [main, feat/compensation-engine]
  pull_request:
    branches: [main, feat/p2-professional-question-editor-20261012]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        # package-lock.json on main predates npm 11's full optional-platform lock expansion.
        # Keep CI read-only with respect to the repository while installing from package.json.
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Validate read-only P2 pilot preflight syntax
        run: |
          node --check scripts/p2-pilot-readonly-check.mjs
          node --check scripts/p2-acceptance-branch-check.mjs
          node --check scripts/p2-live-http-acceptance.mjs
          node --check scripts/p2-browser-acceptance.mjs
          node --check scripts/p2-browser-revision-cleanup.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        # DB integration suites intentionally require real Pilot DB credentials and are run only in guarded environments.
        run: npx vitest run --exclude 'tests/integration/**'


      - name: Build
        run: npm run build

      - name: Navigation browser checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/prolig-navigation-preview.log 2>&1 &
          node scripts/verify-navigation.mjs

  native-financial-concurrency:
    # Runs only for a PR into the P2 feature branch. The database exists ONLY
    # inside this ephemeral GitHub Actions job; never connect to Neon or DATABASE_URL.
    if: github.event_name == 'pull_request' && github.base_ref == 'feat/p2-professional-question-editor-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prolig_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: prolig_finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prolig_ci -d prolig_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SETTLEMENT_TEST_DATABASE_URL: postgresql://prolig_ci:ephemeral_ci_only@127.0.0.1:5432/prolig_finance_ci
      PROLIG_SETTLEMENT_TEST_DB_CONFIRMED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Generate Prisma Client (no DB access)
        run: npx prisma generate
      - name: Native 8-connection PostgreSQL settlement and concurrency contracts
        run: npx vitest run tests/integration/settlement-db.test.ts
