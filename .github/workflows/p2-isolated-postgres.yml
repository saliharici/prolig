name: P2 Isolated PostgreSQL Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/integration/p2-multitype-db.test.ts'
      - 'tests/integration/release05-author-library-db.test.ts'
      - '.github/workflows/p2-isolated-postgres.yml'
      - 'api/v1/questions/**'
      - 'api/v1/_lib/question-**'
      - 'src/questions/**'
      - 'shared/question-contract.ts'
      - 'prisma/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-real-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p2_ci
          POSTGRES_PASSWORD: p2_ci_only
          POSTGRES_DB: prolig_p2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2_ci -d prolig_p2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Strict localhost-only ephemeral PostgreSQL; never connect to Neon or Production.
      DIRECT_URL: postgresql://p2_ci:p2_ci_only@127.0.0.1:5432/prolig_p2_ci?sslmode=disable
      DATABASE_URL: postgresql://p2_ci:p2_ci_only@127.0.0.1:5432/prolig_p2_ci?sslmode=disable
      AUTH_SECRET: ci-only-p2-isolation-not-a-production-secret-20261015
      PROLIG_QUESTION_TYPES_P2: 'true'
      PROLIG_P2_CI_ISOLATED_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply all migrations to temporary empty PostgreSQL
        run: npx prisma migrate deploy
      - name: Real POST/GET/PATCH acceptance for three question types and legacy format
        run: npx vitest run tests/integration/p2-multitype-db.test.ts tests/integration/release05-author-library-db.test.ts
